name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Backend ruff checks
        working-directory: backend
        run: |
          uv sync --dev
          uv run ruff check .
          uv run ruff format --check .
      
      - name: Install bun
        uses: oven-sh/setup-bun@v2
      
      - name: Frontend linting
        working-directory: frontend
        run: |
          bun install --frozen-lockfile
          bun run lint

  test:
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:15.4
        env:
          POSTGRES_USER: user_ci
          POSTGRES_PASSWORD: password_ci
          POSTGRES_DB: synapse_ci
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval=10s --health-timeout=5s --health-retries=5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Backend tests
        working-directory: backend
        env:
          SECRET_KEY: your-super-safe-secret-key-for-testing-purposes-only
          # Ephemeral CI DB. Local pytest uses TEST_DATABASE_URL → synapse_test instead.
          DATABASE_URL: postgresql+asyncpg://user_ci:password_ci@localhost:5432/synapse_ci
        run: |
          uv sync --dev
          uv run alembic upgrade head
          uv run pytest

      - name: Frontend tests
        run: echo "frontend tests TBD"
  
  docker:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build backend docker image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: synapse-backend:ci
      
      - name: Build frontend docker image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          tags: synapse-frontend:ci
